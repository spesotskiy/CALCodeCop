name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          pkgs=$(go list ./... 2>/dev/null || true)
          if [ -z "$pkgs" ]; then
            echo "No packages to test yet"
            exit 0
          fi
          go test ./...
